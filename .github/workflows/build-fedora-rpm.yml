name: Build Fedora SRPM/RPM

on:
  push:
    tags:
      - 'v*'           # trigger on tags like v0.50
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional override for the version (e.g. 0.50). When set, this is used instead of deriving the version from a git tag.'
        required: false
        default: ''

env:
  SPEC_PATH: packaging/fedora/wakeonlan.spec
  RPMBUILD_DIR: ${{ github.workspace }}/rpmbuild

jobs:
  build-rpm:
    name: Build SRPM and RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version from tag or input
        id: ver
        run: |
          # If the workflow was run with an input 'version' (workflow_dispatch), use it.
          # Otherwise try to derive the version from the tag name (GITHUB_REF_NAME).
          INPUT_VERSION="${{ github.event.inputs.version }}"
          # When triggered by push:tags, GITHUB_REF_NAME is available (e.g. "v0.50").
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Install build tools
        run: |
          dnf -y update
          dnf -y install rpm-build rpmdevtools make git rpmlint \
            perl-ExtUtils-MakeMaker \
            perl-Test-Simple \
            perl-Test-Pod \
            perl-Test-Pod-Coverage \
            perl-Test-Spelling \
            perl-Test-Perl-Critic \
            perl-generators \
            perl-interpreter
          dnf -y clean all

      - name: Create upstream tarball from tag
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          NAME=wakeonlan
          mkdir -p dist
          TAG="v${VERSION}"
          # Download the GitHub release archive for the tag (works even without .git in workspace)
          curl -L -o dist/${NAME}-${VERSION}.tar.gz \
            https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz

      - name: Prepare rpmbuild tree and spec
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          mkdir -p $RPMBUILD_DIR/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/wakeonlan-${VERSION}.tar.gz $RPMBUILD_DIR/SOURCES/
          cp $SPEC_PATH $RPMBUILD_DIR/SPECS/wakeonlan.spec
          # Update Version: line in the spec to match tag (if you prefer to keep spec version, remove this line)
          # sed -i "s/^Version:.*/Version: ${VERSION}/" $RPMBUILD_DIR/SPECS/wakeonlan.spec
          ls -l $RPMBUILD_DIR/SOURCES/ $RPMBUILD_DIR/SPECS/

      - name: Build SRPM
        run: |
          rpmbuild --define "_topdir $RPMBUILD_DIR" -bs $RPMBUILD_DIR/SPECS/wakeonlan.spec
          ls -l $RPMBUILD_DIR/SRPMS

      - name: Build binary RPMs
        run: |
          rpmbuild --define "_topdir $RPMBUILD_DIR" -ba $RPMBUILD_DIR/SPECS/wakeonlan.spec
          ls -lR $RPMBUILD_DIR/RPMS || true

      - name: Run rpmlint on built RPMs (optional check)
        run: |
          set -e
          find $RPMBUILD_DIR/RPMS -type f -name '*.rpm' -print0 | xargs -r -0 rpmlint || true

      - name: Upload SRPM and RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wakeonlan-rpms
          path: |
            ${{ env.RPMBUILD_DIR }}/SRPMS/*.src.rpm
            ${{ env.RPMBUILD_DIR }}/RPMS/**/*.rpm
